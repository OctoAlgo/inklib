# Builds and tests TEMPLATE/ in this repo. TEMPLATE/.github/workflows/ci.yml is the same set of
# jobs for a lib made from the template; keep the two in step.
name: Template

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: TEMPLATE
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - run: native/build_and_test.sh ${{ matrix.rid }}

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/check-no-game-data.sh
      - run: unity/pack.sh

  # A lib made from the template must build and pass too.
  copy-and-rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - run: |
          cp -r . "$RUNNER_TEMP/inklib-demo"
          cd "$RUNNER_TEMP/inklib-demo"
          ./rename.sh demo Demo
          if grep -rIl -e tpl -e TPL -e Tpl . --exclude=rename.sh; then echo "template names left after rename"; exit 1; fi
          dotnet test
          native/build_and_test.sh linux-x64
